# Render Blueprint: New > Blueprint > pick this repo. Deploys the whole app as one web service.
services:
  - type: web
    name: truck-route-safety
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
